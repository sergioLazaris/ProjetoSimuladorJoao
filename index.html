<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Simulador com Imagens Locais</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #e0f7fa;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px;
      margin: 0;
    }

    h1 {
      color: #00796b;
    }

    .input-group {
      margin: 15px 0;
    }

    label {
      font-weight: 600;
      margin-right: 10px;
    }

    input {
      padding: 8px;
      border-radius: 5px;
      border: 1px solid #00796b;
      width: 150px;
      font-size: 1rem;
    }

    button {
      background-color: #00796b;
      color: white;
      border: none;
      padding: 10px 25px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #004d40;
    }

    #resultado {
      margin-top: 25px;
      font-size: 1.5rem;
      color: #004d40;
      font-weight: 700;
    }

    /* Estrada com imagem local */
    .road {
    position: relative;
    margin-top: 50px;
    width: 80vw;
    max-width: 900px;
    height: 150px; /* maior que antes */
    background-image: url('imagens/estrada.png');
    background-size: auto 100%;
    background-repeat: repeat-x;
    background-position: bottom;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 5px 10px rgba(0,0,0,0.2);
    }

    .car {
    position: absolute;
    top: 60px; /* ajuste pra alinhar com estrada */
    left: 0;
    width: 120px; /* maior */
    height: 80px; /* maior */
    background-image: url('imagens/carro.png');
    background-size: contain;
    background-repeat: no-repeat;
    user-select: none;
    }

  </style>
</head>
<body>

  <h1>Simulador de Velocidade Média</h1>

  <div class="input-group">
    <label for="distancia">Distância (km):</label>
    <input type="number" id="distancia" step="0.01" min="0" />
  </div>

  <div class="input-group">
    <label for="tempo">Tempo (horas):</label>
    <input type="number" id="tempo" step="0.01" min="0" />
  </div>

  <button onclick="calcularVelocidade()">Calcular e Animar</button>

  <div id="resultado"></div>

  <div class="road">
    <div class="car" id="car"></div>
  </div>

  <script>
    const car = document.getElementById('car');
    let animationId;

    function calcularVelocidade() {
      const distancia = parseFloat(document.getElementById('distancia').value);
      const tempo = parseFloat(document.getElementById('tempo').value);

      if (isNaN(distancia) || distancia <= 0 || isNaN(tempo) || tempo <= 0) {
        alert('Por favor, insira valores válidos e maiores que zero.');
        return;
      }

      const velocidadeMedia = distancia / tempo;
      document.getElementById('resultado').innerText = `Velocidade média: ${velocidadeMedia.toFixed(2)} km/h`;

      animarCarro(velocidadeMedia);
    }

    function animarCarro(velocidade) {
      if(animationId) cancelAnimationFrame(animationId);

      const road = document.querySelector('.road');
      const roadWidth = road.clientWidth;
      const carWidth = car.clientWidth;

      const escala = 3; // pixels por segundo para cada km/h
      const velocidadePixelsPorSegundo = velocidade * escala;

      let posX = 0;
      let ultimoTimestamp = null;

      function step(timestamp) {
        if (!ultimoTimestamp) ultimoTimestamp = timestamp;
        const delta = (timestamp - ultimoTimestamp) / 1000;
        ultimoTimestamp = timestamp;

        posX += velocidadePixelsPorSegundo * delta;

        if (posX > roadWidth) {
          posX = -carWidth;
        }

        car.style.left = posX + 'px';

        animationId = requestAnimationFrame(step);
      }

      animationId = requestAnimationFrame(step);
    }
  </script>

</body>
</html>
