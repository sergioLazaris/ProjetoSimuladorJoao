<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Simulador com seleção de carrinho e pista</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #e0f7fa;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px;
      margin: 0;
    }

    h1 {
      color: #00796b;
    }

    .input-group, .select-group {
      margin: 15px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    label {
      font-weight: 600;
      min-width: 130px;
    }

    input, select {
      padding: 8px;
      border-radius: 5px;
      border: 1px solid #00796b;
      font-size: 1rem;
      min-width: 180px;
    }

    button {
      background-color: #00796b;
      color: white;
      border: none;
      padding: 10px 25px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #004d40;
    }

    #resultado {
      margin-top: 25px;
      font-size: 1.5rem;
      color: #004d40;
      font-weight: 700;
      min-height: 36px;
    }

    .road {
      position: relative;
      margin-top: 50px;
      width: 90vw;       /* ocupa quase toda a tela */
      max-width: 1200px; /* pista mais larga */
      height: 250px;     /* pista mais alta */
      background-image: url('imagens/pista1.png');
      background-size: auto 100%;
      background-repeat: repeat-x;
      background-position: bottom;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 5px 10px rgba(0,0,0,0.2);
    }

    .car {
      position: absolute;
      top: 100px;         /* ajusta a posição vertical dentro da pista maior */
      left: 0;
      width: 200px;       /* aumenta largura do carro */
      height: 130px;      /* aumenta altura do carro */
      background-image: url('imagens/carro1.png');
      background-size: contain;
      background-repeat: no-repeat;
      user-select: none;
      pointer-events: none;
    }

  </style>
</head>
<body>

  <h1>Simulador de Velocidade Média</h1>

  <div class="input-group">
    <label for="distancia">Distância (km):</label>
    <input type="number" id="distancia" step="0.01" min="0" placeholder="Ex: 100" />
  </div>

  <div class="input-group">
    <label for="tempo">Tempo (horas):</label>
    <input type="number" id="tempo" step="0.01" min="0" placeholder="Ex: 2" />
  </div>

  <div class="select-group">
    <label for="select-carro">Escolha o carrinho:</label>
    <select id="select-carro" onchange="trocarCarro()">
      <option value="imagens/carro1.png">Ferrari</option>
      <option value="imagens/carro2.png">Uno Mille</option>
      <option value="imagens/carro3.png">Mustang GT</option>
    </select>
  </div>

  <div class="select-group">
    <label for="select-pista">Escolha a pista:</label>
    <select id="select-pista" onchange="trocarPista()">
      <option value="imagens/pista1.png">Pista de Asfalto</option>
      <option value="imagens/pista2.png">Pista de Terra</option>
      <option value="imagens/pista3.png">Pista Noturna</option>
    </select>
  </div>

  <button onclick="calcularVelocidade()">Calcular e Animar</button>

  <div id="resultado"></div>

  <div class="road">
    <div class="car" id="car"></div>
  </div>

  <script>
    const car = document.getElementById('car');
    const road = document.querySelector('.road');
    let animationId;

    function trocarCarro() {
      const selectCarro = document.getElementById('select-carro');
      const imgCarro = selectCarro.value;
      car.style.backgroundImage = `url('${imgCarro}')`;
    }

    function trocarPista() {
      const selectPista = document.getElementById('select-pista');
      const imgPista = selectPista.value;
      road.style.backgroundImage = `url('${imgPista}')`;
    }

    function calcularVelocidade() {
      const distancia = parseFloat(document.getElementById('distancia').value);
      const tempo = parseFloat(document.getElementById('tempo').value);

      if (isNaN(distancia) || distancia <= 0 || isNaN(tempo) || tempo <= 0) {
        alert('Por favor, insira valores válidos e maiores que zero.');
        return;
      }

      const velocidadeMedia = distancia / tempo;
      document.getElementById('resultado').innerText = `Velocidade média: ${velocidadeMedia.toFixed(2)} km/h`;

      animarCarro(velocidadeMedia);
    }

    function animarCarro(velocidade) {
      if(animationId) cancelAnimationFrame(animationId);

      const roadWidth = road.clientWidth;
      const carWidth = car.clientWidth;

      const escala = 10; // pixels por segundo para cada km/h
      const velocidadePixelsPorSegundo = velocidade * escala;

      let posX = 0;
      let ultimoTimestamp = null;

      function step(timestamp) {
        if (!ultimoTimestamp) ultimoTimestamp = timestamp;
        const delta = (timestamp - ultimoTimestamp) / 1000;
        ultimoTimestamp = timestamp;

        posX += velocidadePixelsPorSegundo * delta;

        if (posX > roadWidth) {
          posX = -carWidth;
        }

        car.style.left = posX + 'px';

        animationId = requestAnimationFrame(step);
      }

      animationId = requestAnimationFrame(step);
    }

    // Inicializa com as imagens padrão
    trocarCarro();
    trocarPista();
  </script>

</body>
</html>
